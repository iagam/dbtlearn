version: 2

models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings data.
    columns:

     - name: listing_id
       description: Unique identifier for each listing.
       tests:
         - unique
         - not_null

     - name: host_id
       description: The host's id, references the hosts table.
       tests:
         - not_null
         - relationships:
             to: ref('dim_hosts_cleansed')
             field: host_id

     - name: room_type
       description: Type of room offered in the listing.
       tests:
         - accepted_values:
             values: ['Entire home/apt',
                      'Private room',
                      'Shared room',
                      'Hotel room']

     - name: minimum_nights
       description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
       tests:
         - positive_value

  - name: dim_hosts_cleansed
    description: Cleansed table which contains Airbnb hosts data.
    columns:

     - name: host_id
       description: Unique identifier for each host.
       tests:
         - unique
         - not_null

     - name: host_name
       description: Name of the host.
       tests:
         - not_null

     - name: is_superhost
       description: Indicates if the host is a superhost.
       tests:
          - accepted_values:
              values: ['t', 'f']

  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source("airbnb" ,"listings")